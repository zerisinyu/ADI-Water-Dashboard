services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./Data:/app/Data:ro
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROK_API_KEY=${GROK_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - ENABLE_CHAT_WIDGET=${ENABLE_CHAT_WIDGET:-true}
    restart: unless-stopped
