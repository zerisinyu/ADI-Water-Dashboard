[project]
name = "adi-water-dashboard"
version = "2.0.0"
description = "Water Utility Performance Platform for African Development Indicators"
requires-python = ">=3.11,<3.13"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # Line length handled by formatter
    "B905",   # zip strict
    "SIM108", # Ternary operator
]

[tool.ruff.lint.isort]
known-first-party = ["data", "analytics", "components", "src_page"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["Dashboard"]
addopts = "-v --tb=short -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
